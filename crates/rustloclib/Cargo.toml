[package]
name = "rustloclib"
description = "Rust-aware LOC counter that separates production code from tests — even in the same file"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/arthur-debert/rustloc"
documentation = "https://docs.rs/rustloclib"
keywords = ["loc", "lines-of-code", "code-counter", "rust", "test-separation"]
categories = ["development-tools"]

[dependencies]
glob.workspace = true
walkdir.workspace = true
cargo_metadata.workspace = true
thiserror.workspace = true
serde.workspace = true
gix.workspace = true
imara-diff.workspace = true
ra_ap_syntax = "=0.0.349"
tempfile = "3.10"
ruff_python_ast = "0.0.3"
ruff_python_parser = "0.0.3"
ruff_text_size = "0.0.3"
# rustloclib never calls get-size2; this line exists only to keep it at 0.10.1.
# `ruff_python_ast` derives `get_size2::GetSize` on syntax nodes that hold a
# `compact_str 0.9::CompactString`, and it asks for `compact_str = "0.9.0"`
# plus `get-size2 = "0.10.0"`. get-size2 0.10.2 moved its optional
# `compact_str` dependency to 0.10, so any resolution free to pick 0.10.2 or
# later puts two `compact_str` versions in the graph: get-size2 implements
# `GetSize` for the 0.10 `CompactString`, ruff stores the 0.9 one, and the
# derive fails to compile with "the trait bound `CompactString: GetSize` is
# not satisfied". Cargo is happy — the two requirements are both satisfiable —
# so only an exact version keeps a fresh, unlocked `cargo install rustloc`
# building (issue #154). Drop the pin once ruff and get-size2 publish
# requirements that agree on one `compact_str`; `bin/check-unlocked-install.sh`
# fails if it is dropped early.
get-size2 = "=0.10.1"
# rustloclib never uses unicode-ident or unicode-properties directly; these
# lines keep both on the same Unicode version. `ra-ap-rustc_lexer` (pulled in
# by the `ra_ap_*` crates below) asks for `unicode-ident = "1.0.22"` and
# `unicode-properties = "0.1.4"`, and a const assertion in it refuses to
# compile unless the two crates report the same `UNICODE_VERSION`.
# unicode-ident 1.0.25 moved to Unicode 18 while unicode-properties 0.1.4 (the
# newest release) is still on Unicode 17, so a fresh, unlocked
# `cargo install rustloc` picks a pair that fails with "unicode-properties and
# unicode-ident must use the same Unicode version". Both are capped to their
# Unicode 17 releases: capping only unicode-ident would break again the day
# unicode-properties ships Unicode 18. Drop both lines once unicode-properties
# publishes a Unicode 18 release, so the newest versions of the two agree
# again; `bin/check-unlocked-install.sh` shows whether a fresh resolution builds.
unicode-ident = ">=1.0.22, <1.0.25"
unicode-properties = { version = "=0.1.4", default-features = false }
# rustloclib never uses salsa directly; this line exists only to keep it at
# 0.28.2. Every `ra_ap_*` 0.0.349 crate asks for `salsa = "0.28.2"`, and
# `ra_ap_span` implements `salsa::plumbing::HashEqLike::hash` by hand. salsa
# 0.28.3 removed `hash` from that trait, so a fresh, unlocked
# `cargo install rustloc` that picks 0.28.3 or later fails in `ra_ap_span`
# with "method `hash` is not a member of trait `zalsa_::HashEqLike`". The
# newest `ra_ap_*` release (0.0.352) still has that impl, so upgrading them
# does not help. salsa-macro-rules needs the same exact pin: salsa 0.28.2 asks
# only for `salsa-macro-rules = "0.28.2"`, and the 0.28.3+ macros generate
# `intern` calls with a different argument count than salsa 0.28.2 accepts.
# Drop both pins once an `ra_ap_*` release builds against the newest salsa
# and rustloclib moves to it.
salsa = { version = "=0.28.2", default-features = false }
salsa-macro-rules = "=0.28.2"
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
ra_ap_load-cargo = { version = "=0.0.349", default-features = false }
ra_ap_project_model = { version = "=0.0.349", default-features = false }
ra_ap_hir = { version = "=0.0.349", default-features = false }
ra_ap_ide_db = { version = "=0.0.349", default-features = false }
ra_ap_vfs = { version = "=0.0.349", default-features = false }
ra_ap_paths = { version = "=0.0.349", default-features = false }

